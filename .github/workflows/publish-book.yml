name: Publish book PDF

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "scripts/build_book.py"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

concurrency:
  group: the-last-watch-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Validate manuscript and publish PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF build requirements
        run: python -m pip install --disable-pip-version-check "reportlab>=4,<5" "pypdf>=5,<7"

      - name: Validate expanded narrative and continuity
        run: python -m unittest discover -s tests -v

      - name: Build novel PDF
        run: python scripts/build_book.py

      - name: Check PDF integrity, narrative completeness and metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          path = Path("books/The_Last_Watch_Extended_Edition.pdf")
          reader = PdfReader(str(path))
          assert len(reader.pages) >= 130, f"Unexpectedly short expanded PDF: {len(reader.pages)} pages"
          assert not reader.is_encrypted
          alltext = "\n".join(p.extract_text() or "" for p in reader.pages)
          for phrase in ("THE LAST WATCH", "CHAPTER ONE", "CHAPTER THIRTEEN", "EPILOGUE", "THE END", "THE SHIP THAT BREATHES", "THE WEATHER HAS NO ALLIES", "THE HEARING ROOM", "THE VOICES AT HOME", "THE LAST MANIFEST", "THE PEOPLE WE HAD PROMISED"):
              assert phrase in alltext, f"Missing expected section: {phrase}"
          assert len(alltext) > 145000, f"Expanded PDF text extraction too short: {len(alltext)} chars"
          assert int(reader.pages[0].mediabox.width) == 432 and int(reader.pages[0].mediabox.height) == 648, "Unexpected trim size"
          print(f"Validated {len(reader.pages)} pages and {len(alltext):,} extracted characters.")
          PY

      - name: Upload PDF as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Watch-Book-PDF
          path: books/The_Last_Watch_Extended_Edition.pdf
          if-no-files-found: error

      - name: Commit published edition to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/The_Last_Watch_Extended_Edition.pdf
          if ! git diff --cached --quiet; then
            git commit -m "book: publish refreshed The Last Watch PDF"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "The published PDF is already current."
          fi
