name: Publish book PDF

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "scripts/build_book.py"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

concurrency:
  group: the-last-watch-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Validate manuscript and publish PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF build requirements
        run: python -m pip install --disable-pip-version-check "reportlab>=4,<5" "pypdf>=5,<7"

      - name: Validate expanded narrative and continuity
        run: python -m unittest discover -s tests -v

      - name: Build novel PDF
        run: python scripts/build_book.py

      - name: Check PDF integrity, narrative completeness and metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          path = Path("books/The_Last_Watch_Extended_Edition.pdf")
          reader = PdfReader(str(path))
          assert len(reader.pages) >= 410, f"Unexpectedly short expanded PDF: {len(reader.pages)} pages"
          assert not reader.is_encrypted
          assert "Diesel" in (reader.metadata.author or ""), "Missing Diesel author credit"
          alltext = "\n".join(p.extract_text() or "" for p in reader.pages)
          for phrase in ("THE LAST WATCH", "CHAPTER ONE", "CHAPTER THIRTEEN", "EPILOGUE", "THE END", "THE SHIP THAT BREATHES", "THE WEATHER HAS NO ALLIES", "THE HEARING ROOM", "THE VOICES AT HOME", "THE LAST MANIFEST", "THE PEOPLE WE HAD PROMISED", "THE FIRST CROSSING", "THE SILENT QUARTER", "THE FISHERMAN", "THE PIER AT REYKJAV", "WHAT THE ORDERS DID NOT SAY", "BENEATH AURORA", "BEFORE THE SECOND SALVO", "THE COLD HOURS", "THE VOICE FROM HAWTHORNE", "THE UNWRITTEN MAP", "THE CORRIDOR OF LIGHTS", "THE FIRST LEDGER", "THE DARK WATER BETWEEN", "THE FREIGHTER AT THE EDGE", "WHERE THE CARGO WENT", "THE CONVOY AFTER OURS", "THE TWELVE TRACKS", "RAVEN ONE\u0027S EMPTY SEAT", "THE DISTANCE HOME", "WHAT ETHAN CHOSE", "THE TANKER", "THE LIEUTENANT", "A SPACE FOR THE LIVING", "THE ELEVENTH SURVIVOR", "THE VISITOR FROM CUTLASS"):
              assert phrase in alltext, f"Missing expected section: {phrase}"
          assert len(alltext) > 415000, f"Expanded PDF text extraction too short: {len(alltext)} chars"
          assert int(reader.pages[0].mediabox.width) == 432 and int(reader.pages[0].mediabox.height) == 648, "Unexpected trim size"
          print(f"Validated {len(reader.pages)} pages and {len(alltext):,} extracted characters.")
          PY

      - name: Upload PDF as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Watch-Book-PDF
          path: books/The_Last_Watch_Extended_Edition.pdf
          if-no-files-found: error

      - name: Publish from latest source without overwriting other commits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=0
          for attempt in 1 2 3 4 5; do
            echo "Publication attempt $attempt: refresh main and rebuild"
            git fetch origin main
            # Only the disposable Actions workspace is reset. Remote history
            # is never rewritten, and the PDF is built from current sources.
            git reset --hard origin/main
            python -m unittest discover -s tests -v
            python scripts/build_book.py
            python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path("books/The_Last_Watch_Extended_Edition.pdf")
          reader = PdfReader(str(pdf))
          assert not reader.is_encrypted
          assert len(reader.pages) >= 410
          assert "Diesel" in (reader.metadata.author or "")
          body = "\n".join(p.extract_text() or "" for p in reader.pages)
          assert len(body) > 415000
          assert "THE END" in body
          print(f"Validated latest-source PDF: {len(reader.pages)} pages")
          PY
            git add books/The_Last_Watch_Extended_Edition.pdf
            if git diff --cached --quiet; then
              echo "Published PDF already matches current manuscript."
              published=1
              break
            fi
            git commit -m "book: publish refreshed The Last Watch PDF"
            if git push origin HEAD:main; then
              echo "Committed validated PDF against current main."
              published=1
              break
            fi
            echo "New changes arrived before publication; rebuilding latest source."
          done
          if [ "$published" -ne 1 ]; then
            echo "Failed to publish without rewriting remote history."
            exit 1
          fi
